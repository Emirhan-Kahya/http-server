<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Temel meta etiketleri ve karakter seti -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <!-- Stil dosyaları -->
    <link rel="stylesheet" href="/style.css">
    <!-- Font Awesome ikonları için CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <!-- Ana konteyner - Tüm içeriği sarar -->
    <div class="container">
        <!-- Giriş/Kayıt Formu Bölümü -->
        <div class="auth-container" id="authContainer">
            <!-- Giriş Formu -->
            <div class="auth-form" id="loginForm">
                <h2>Login</h2>
                <input type="text" id="loginUsername" placeholder="Username">
                <input type="password" id="loginPassword" placeholder="Password">
                <button onclick="login()">Login</button>
                <p>Don't have an account? <a href="#" onclick="toggleAuth()">Register</a></p>
            </div>
            <!-- Kayıt Formu -->
            <div class="auth-form" id="registerForm" style="display: none;">
                <h2>Register</h2>
                <input type="text" id="registerUsername" placeholder="Username">
                <input type="password" id="registerPassword" placeholder="Password">
                <button onclick="register()">Register</button>
                <p>Already have an account? <a href="#" onclick="toggleAuth()">Login</a></p>
            </div>
        </div>

        <!-- Chat Arayüzü Bölümü -->
        <div class="chat-container" style="display: none;" id="chatContainer">
            <!-- Chat Başlığı -->
            <div class="chat-header">
                <h2 id="chatUsername"></h2>
                <button onclick="logout()" class="logout-btn">Logout</button>
            </div>
            <!-- Mesaj Görüntüleme Alanı -->
            <div id="messageContainer"></div>
            <!-- Mesaj Gönderme Formu -->
            <form id="messageForm">
                <div class="input-container">
                    <input type="text" id="messageInput" placeholder="Type a message...">
                    <!-- Dosya Ekleme Butonları -->
                    <div class="attachment-buttons">
                        <!-- Dosya Ekleme -->
                        <label for="fileInput" class="attach-button">
                            <i class="fas fa-paperclip"></i>
                        </label>
                        <input type="file" id="fileInput" style="display: none" multiple>
                        <!-- Resim Ekleme -->
                        <label for="imageInput" class="attach-button">
                            <i class="fas fa-image"></i>
                        </label>
                        <input type="file" id="imageInput" accept="image/*" style="display: none" multiple>
                    </div>
                </div>
                <button type="submit">➤</button>
            </form>
        </div>

        <!-- Terminal Bölümü - Server Mesajları -->
        <div class="terminal">
            <!-- Terminal Başlığı -->
            <div class="terminal-header">
                Server Messages <span id="status" class="status-indicator disconnected"></span>
            </div>
            <!-- Server Log Mesajları -->
            <div id="serverLogs"></div>
        </div>
    </div>

    <!-- JavaScript Dosyası -->
    <script src="script.js"></script>
</body>
</html>
